# pre-commit configuration for the nixpkgs dotfiles repo.
#
# trufflehog scans the files being committed for accidentally-leaked secrets
# (API keys, OAuth client secrets, cloud credentials, tokens, ...). The
# `pre-commit` and `trufflehog` binaries are provided by home-manager
# (see home/packages.nix), so this is a `language: system` local hook that
# invokes the trufflehog binary already on PATH.
#
# `--no-verification` keeps the gate fast and offline (no live provider
# calls); `--fail` makes it a hard gate (exit 183) on any detection, so a
# commit containing a secret is blocked.
repos:
  - repo: local
    hooks:
      - id: trufflehog
        name: trufflehog (secret scanner)
        description: Block commits that contain detected secrets.
        entry: trufflehog --no-verification --fail filesystem
        language: system
