# vulnix whitelist — SUPPRESS FALSE POSITIVES ONLY
#
# vulnix matches by product NAME + VERSION against NVD CPEs, which collides
# when an unrelated product shares a name. The entries below are NVD matches
# for a DIFFERENT product than what is actually in the Nix closure.
#
# Real vulnerabilities are intentionally NOT whitelisted so they stay visible.
# Regenerate the full list:  vulnix -C <system> -W vulnix.whitelist.toml
# Scan with the whitelist:   vulnix -S -w vulnix.whitelist.toml

# zlib-1.3.2: both CVEs are name collisions, NOT the canonical C zlib
#   CVE-2023-6992 = Cloudflare's zlib *fork*; CVE-2026-27820 = the Ruby `zlib` gem.
["zlib-1.3.2"]
cve = [ "CVE-2023-6992", "CVE-2026-27820" ]

# ada-4.0.0: CVE-2024-9410 is "Ada.cx" (a web service), not the C++ `ada` HTTP parser.
["ada-4.0.0"]
cve = "CVE-2024-9410"

# git-2.56.0: all six CVEs are for the Jenkins "Git Plugin", not git the CLI.
["git-2.56.0"]
cve = [ "CVE-2021-21684", "CVE-2022-30947", "CVE-2022-36882", "CVE-2022-36883", "CVE-2022-36884", "CVE-2022-38663" ]
["git-2.56.0-fish-completions"]
cve = [ "CVE-2021-21684", "CVE-2022-30947", "CVE-2022-36882", "CVE-2022-36883", "CVE-2022-36884", "CVE-2022-38663" ]

# openmp-21.1.8: CVE-2022-26345 is Intel(R) oneAPI Toolkit OpenMP, not nixpkgs `openmp`.
["openmp-21.1.8"]
cve = "CVE-2022-26345"

# shellcheck-0.11.0: CVE-2021-28794 is the *VS Code* ShellCheck extension, not the binary.
["shellcheck-0.11.0"]
cve = "CVE-2021-28794"
["ShellCheck-0.11.0"]
cve = "CVE-2021-28794"
